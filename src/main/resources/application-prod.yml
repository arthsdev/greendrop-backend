version: '3.9'

services:
  app:
    extends:
      file: ../../../docker-compose.yml
      service: app
    env_file:
      - ../../../.env.prod
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "8080:8080"
    restart: always

  db:
    extends:
      file: ../../../docker-compose.yml
      service: db
    env_file:
      - ../../../.env.prod
    restart: always

  redis:
    extends:
      file: ../../../docker-compose.yml
      service: redis
    env_file:
      - ../../../.env.prod
    restart: always
